<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة مع وضع مظلم</title>
    <style>
        /* التصميم الأساسي */
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
            transition: background-color 0.3s, color 0.3s;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        
        /* الوضع المظلم */
        body.dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }
        
        body.dark-mode a {
            color: #bb86fc;
        }
        
        /* تصميم زر التبديل */
        .dark-mode-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 24px;
            z-index: 1000;
            transition: transform 0.3s;
        }
        
        .dark-mode-toggle:hover {
            transform: scale(1.1);
        }
        
        /* محتوى الصفحة كمثال */
        .content {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- زر تبديل الوضع المظلم -->
    <button class="dark-mode-toggle" aria-label="تبديل الوضع المظلم">🌓</button>
    
    <!-- محتوى الصفحة -->
    <div class="content">
        <h1>مرحباً بك في صفحتي</h1>
        <p>هذه صفحة تجريبية تحتوي على ميزة الوضع المظلم. يمكنك الضغط على الأيقونة في أعلى الصفحة لتبديل بين الوضع المظلم والوضع الفاتح.</p>
        <p>الوضع المظلم هنا خفيف وغير مزعج للعين، مع الحفاظ على التباين الجيد للنص.</p>
    </div>

    <script>
        // اختيار العناصر
        const toggleButton = document.querySelector('.dark-mode-toggle');
        const body = document.body;
        
        // التحقق من التفضيل المحفوظ
        if (localStorage.getItem('darkMode') === 'enabled') {
            body.classList.add('dark-mode');
            toggleButton.textContent = '☀️';
        }
        
        // حدث النقر على الزر
        toggleButton.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            
            // حفظ التفضيل
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('darkMode', 'enabled');
                toggleButton.textContent = '☀️';
            } else {
                localStorage.setItem('darkMode', 'disabled');
                toggleButton.textContent = '🌓';
            }
        });
    </script>
</body>
</html>
