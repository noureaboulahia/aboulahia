    <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أزرار التمرير</title>
    <style>
        body {
            height: 3000px;
            font-family: Arial, sans-serif;
        }

        /* زر مشترك */
        .scroll-btn {
            position: fixed;
            bottom: 50px;
            width: 50px;
            height: 50px;
            font-size: 24px;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .scroll-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* زر النزول لأسفل */
        #goBottomBtn {
            right: 20px;
            background-color: #007bff;
        }

        /* زر النزول مقدار شاشة */
        #scrollDownOneScreenBtn {
            left: 20px;
            background-color: #28a745;
        }

        /* زر الصعود للأعلى */
        #goTopBtn {
            left: 50%;
            transform: translateX(-50%);
            background-color: #dc3545;
        }

        /* التلميحات */
        .scroll-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .scroll-btn:hover::after {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- زر النزول إلى أسفل الصفحة -->
    <button id="goBottomBtn" class="scroll-btn" data-tooltip="انزل إلى أسفل الصفحة">⬇</button>

    <!-- زر النزول بمقدار شاشة واحدة -->
    <button id="scrollDownOneScreenBtn" class="scroll-btn" data-tooltip="انزل بمقدار شاشة واحدة">↓</button>

    <!-- زر الصعود إلى أعلى الصفحة -->
    <button id="goTopBtn" class="scroll-btn" data-tooltip="ارجع إلى أعلى الصفحة">⬆</button>

    <script>
        // وظائف الأزرار
        document.getElementById("goBottomBtn").onclick = function () {
            window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
        };

        document.getElementById("scrollDownOneScreenBtn").onclick = function () {
            window.scrollBy({ top: window.innerHeight, behavior: "smooth" });
        };

        document.getElementById("goTopBtn").onclick = function () {
            window.scrollTo({ top: 0, behavior: "smooth" });
        };

        // التحكم في الظهور والإخفاء مع التمرير
        const scrollButtons = document.querySelectorAll('.scroll-btn');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 100) {
                scrollButtons.forEach(btn => btn.classList.add('visible'));
            } else {
                scrollButtons.forEach(btn => btn.classList.remove('visible'));
            }
        });
    </script>

</body>
</html>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check for saved theme preference or use system preference
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (savedTheme === null && prefersDark)) {
                document.body.classList.add('dark-mode');
            }
            
            // Toggle dark mode when button is clicked
            const darkModeToggle = document.getElementById('darkModeToggle');
            if (darkModeToggle) {
                darkModeToggle.addEventListener('click', function() {
                    document.body.classList.toggle('dark-mode');
                    
                    // Save preference to localStorage
                    if (document.body.classList.contains('dark-mode')) {
                        localStorage.setItem('theme', 'dark');
                    } else {
                        localStorage.setItem('theme', 'light');
                    }
                });
            }
        });
    </script>
    <div class="tab-container">
        <div class="tab" id="tab2" onclick="loadPage('tafsir.html', 'tab2')">المفسّرون والتفسير التحليلي للقرآن</div>
        <div class="tab" id="tab3" onclick="loadPage('hadith.html', 'tab3')">سنّة بلا مذاهب</div>
        <div class="tab active" id="tab1" onclick="loadPage('books.html', 'tab1')">سائر الكتب والسلاسل</div>       
        <div class="tab" id="tab4" onclick="loadPage('search.html', 'tab4')">البحث الشامل</div>
        <div class="tab" id="tab5" onclick="loadPage('sounds.html', 'tab5')">محاضرات ودروس صوتية</div>
    </div>

    <div id="content">
        <!-- Default Page 1 content will be loaded here -->
    </div>

    <script>
        function loadPage(page, tabId) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', page, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
            let contentDiv = document.getElementById("content");
            contentDiv.innerHTML = xhr.responseText;  // Insert the HTML content
            executeScripts(contentDiv);

            // Update the URL correctly
            let urlParams = new URLSearchParams(window.location.search);
            urlParams.set("page", tabId);
            history.replaceState(null, "", `?${urlParams.toString()}`);

            // Update active tab styling
            document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
            document.getElementById(tabId).classList.add("active");
        }
    };
    xhr.onerror = function(error) {
        console.error("Error loading page:", error);
    };
    xhr.send();
}



        function executeScripts(container, tabId) {
            const scripts = container.getElementsByTagName("script");

            for (let script of scripts) {
                let newScript = document.createElement("script");

                if (script.src) {
                    if (document.querySelector(`script[src="${script.src}"][data-tab="${tabId}"]`)) {
                        console.warn(`⚠️ Skipping already loaded script for ${tabId}:`, script.src);
                        continue;
                    }
                    newScript.src = script.src;
                    newScript.async = false;
                    newScript.setAttribute("data-tab", tabId);
                } else {
                    newScript.textContent = `(function() { ${script.textContent} })();`;
                }

                document.body.appendChild(newScript);
            }

            // ✅ Force reapply styles after loading the tab
            setTimeout(() => {
                document.getElementById("searchBox")?.offsetHeight; // Trigger reflow
            }, 50);

            // ✅ Call onPageLoad for the tab if it exists
            setTimeout(() => {
                try {
                    if (typeof window[`onPageLoad_${tabId}`] === "function") {
                        console.log(`✅ Calling onPageLoad for tab ${tabId}...`);
                        window[`onPageLoad_${tabId}`]();
                    } else {
                        console.warn(`⚠️ onPageLoad_${tabId} is not defined.`);
                    }
                } catch (error) {
                    console.error(`❌ Error calling onPageLoad for ${tabId}:`, error);
                }
            }, 100);
        }






        // Load Page 1 as the default page when the site opens
        window.onload = function () {
            const urlParams = new URLSearchParams(window.location.search);
            let page = urlParams.get("page") || "tab1"; // Default to tab1
            let pageFile = {
                "tab1": "books.html",
                "tab2": "tafsir.html",
                "tab3": "hadith.html",
                "tab4": "search.html",
                "tab5": "sounds.html"
            }[page] || "page1.html";

            loadPage(pageFile, page);
        };
        // Handle back/forward navigation
        window.onpopstate = function (event) {
            if (event.state) {
                loadPage(event.state.page, new URLSearchParams(window.location.search).get("page"));
            }
        };
    </script>
