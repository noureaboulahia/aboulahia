<head>

    <style>
        body {
    font-family: 'Droid Arabic Naskh', serif;
    direction: rtl;
    text-align: right;
    background-color: #f8f9fa;
    margin: 0;
    padding-top: 1 !important;
    margin-top: 0 !important;
}

/* مركز التبويبات وجعلها ذات عرض محدد */
.tab-container {
    display: flex;
    justify-content: center; /* يجعل التبويبات في المنتصف */
    background: #6d4c1b; /* بني غامق */
    border-radius: 12px;
    padding: 10px;
    max-width: 80%; /* عرض محدد للحاوية */
    
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
}

/* تحسين تصميم التبويبات */
.tab {
    flex: 1;
    text-align: center;
    padding: 12px 20px;
    cursor: pointer;
    font-size: 17px;
    font-weight: bold;
    color: white;
    background: linear-gradient(135deg, #8b5a2b, #a07045); /* لون بني بتدرج */
    transition: all 0.3s ease-in-out;
    border-radius: 8px;
    margin: 0 5px; /* إضافة مسافة بين التبويبات */
    box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
}

/* تحسين التأثير عند التحويل */
.tab:hover,
.tab.active {
    background: linear-gradient(135deg, #5a3c18, #7a4f2c); /* تأثير لون أغمق */
    transform: translateY(-3px);
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
}

/* تحسين عرض المحتوى */
#content {
    width: 80%;
    min-height: 500px;
    padding: 20px;
    border-top: 3px solid #b28d60;
    background: #f3f1eb;
    border-radius: 12px;
    margin: auto; /* يجعل المحتوى في المنتصف */
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
}
#goTopBtn {
    position: fixed;
    bottom: 16px;
    left: 16px; /* تغيير من right إلى left */
    z-index: 99;
    background-color: #6d4c1b;
    color: white;
    border: none;
    outline: none;
    padding: 8px 10px; /* أصغر حجمًا */
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    transition: all 0.3s ease;
    display: none;
}

#goTopBtn:hover {
    background-color: #a07045;
}

/* 🌟 تحسينات خاصة للهواتف */
@media (max-width: 768px) {
    .tab-container {
        flex-direction: row;
        flex-wrap: wrap;
        max-width: 100%;
        padding: 8px;
        border-radius: 0px;
        border-bottom-left-radius: 18px;
border-bottom-right-radius: 18px;
    }

    .tab {
        font-size: 14px;
        padding: 8px 12px;
        margin: 4px;
        border-radius: 6px;
        flex: 0 0 auto;
    }

    #content {
        width: 100%; /* استخدام العرض الكامل */
        min-height: 300px; /* تقليل ارتفاع المحتوى */
        padding: 10px; /* تقليل التباعد الداخلي */
    }
}
    </style>
</head>

<body>
    <div w3-include-html="../head.html"></div>
    <script>
        includeHTML();
    </script>
    <div id="mySidebar" class="sidebar">
    </div>
    <button id="goTopBtn" title="الرجوع للأعلى">↑</button>
    <script>
        // إظهار الزر عند التمرير
        window.onscroll = function () {
            const btn = document.getElementById("goTopBtn");
            if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
                btn.style.display = "block";
            } else {
                btn.style.display = "none";
            }
        };
    
        // التحرك للأعلى عند الضغط
        document.getElementById("goTopBtn").onclick = function () {
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        };
    </script>
   


    </div>
    <div class="tab-container">
        <div class="tab" id="tab2" onclick="loadPage('tafsir.html', 'tab2')">المفسّرون والتفسير التحليلي للقرآن</div>
        <div class="tab" id="tab3" onclick="loadPage('hadith.html', 'tab3')">سنّة بلا مذاهب</div>
        <div class="tab active" id="tab1" onclick="loadPage('books.html', 'tab1')">سائر الكتب والسلاسل</div>       
        <div class="tab" id="tab4" onclick="loadPage('search.html', 'tab4')">البحث الشامل</div>
    </div>

    <div id="content">
        <!-- Default Page 1 content will be loaded here -->
    </div>

    <script>
        function loadPage(page, tabId) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', page, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
            let contentDiv = document.getElementById("content");
            contentDiv.innerHTML = xhr.responseText;  // Insert the HTML content
            executeScripts(contentDiv);

            // Update the URL correctly
            let urlParams = new URLSearchParams(window.location.search);
            urlParams.set("page", tabId);
            history.replaceState(null, "", `?${urlParams.toString()}`);

            // Update active tab styling
            document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
            document.getElementById(tabId).classList.add("active");
        }
    };
    xhr.onerror = function(error) {
        console.error("Error loading page:", error);
    };
    xhr.send();
}



        function executeScripts(container, tabId) {
            const scripts = container.getElementsByTagName("script");

            for (let script of scripts) {
                let newScript = document.createElement("script");

                if (script.src) {
                    if (document.querySelector(`script[src="${script.src}"][data-tab="${tabId}"]`)) {
                        console.warn(`⚠️ Skipping already loaded script for ${tabId}:`, script.src);
                        continue;
                    }
                    newScript.src = script.src;
                    newScript.async = false;
                    newScript.setAttribute("data-tab", tabId);
                } else {
                    newScript.textContent = `(function() { ${script.textContent} })();`;
                }

                document.body.appendChild(newScript);
            }

            // ✅ Force reapply styles after loading the tab
            setTimeout(() => {
                document.getElementById("searchBox")?.offsetHeight; // Trigger reflow
            }, 50);

            // ✅ Call onPageLoad for the tab if it exists
            setTimeout(() => {
                try {
                    if (typeof window[`onPageLoad_${tabId}`] === "function") {
                        console.log(`✅ Calling onPageLoad for tab ${tabId}...`);
                        window[`onPageLoad_${tabId}`]();
                    } else {
                        console.warn(`⚠️ onPageLoad_${tabId} is not defined.`);
                    }
                } catch (error) {
                    console.error(`❌ Error calling onPageLoad for ${tabId}:`, error);
                }
            }, 100);
        }






        // Load Page 1 as the default page when the site opens
        window.onload = function () {
            const urlParams = new URLSearchParams(window.location.search);
            let page = urlParams.get("page") || "tab1"; // Default to tab1
            let pageFile = {
                "tab1": "books.html",
                "tab2": "tafsir.html",
                "tab3": "hadith.html",
                "tab4": "search.html"
            }[page] || "page1.html";

            loadPage(pageFile, page);
        };
        // Handle back/forward navigation
        window.onpopstate = function (event) {
            if (event.state) {
                loadPage(event.state.page, new URLSearchParams(window.location.search).get("page"));
            }
        };
    </script>

</body>

</html>
